name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DDAZZLE_BUILD_TESTS=ON -DDAZZLE_INSTALL=ON -DDAZZLE_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Install
        run: cmake --install build --config ${{ matrix.config }} --prefix install

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build -DDAZZLE_BUILD_TESTS=ON -DDAZZLE_ENABLE_SANITIZERS=ON -DDAZZLE_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  tools:
    strategy:
      matrix:
        config: [Debug, Release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure editor and standalone example
        run: cmake -S . -B build -DDAZZLE_BUILD_EDITOR=ON -DDAZZLE_BUILD_EXAMPLE=ON -DDAZZLE_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build editor and standalone example
        run: cmake --build build --config ${{ matrix.config }} --target dazzle_editor dazzle_example --parallel
